<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 100" width="380" height="100">
  <!-- "Color on dark" variant: gradient bars + white wordmark.
       Use this on dark / NITEFLYTE backgrounds where the canonical
       navy text in zdata_h_color.svg would lack contrast. -->
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=Syne:ital,wght@1,600;1,700&amp;display=swap');
      .logotype { font-family: 'Syne', sans-serif; font-weight: 700; font-style: italic; font-size: 50px; letter-spacing: 0.01em; fill: #FFFFFF; }
    </style>
    <linearGradient id="zbar-h-c-dark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FF8AB4"/>
      <stop offset="55%" stop-color="#8FB8E8"/>
      <stop offset="100%" stop-color="#FFD89E"/>
    </linearGradient>
  </defs>
  <g>
    <rect x="0" y="48" width="8" height="17" rx="1" fill="url(#zbar-h-c-dark)"/>
    <rect x="11" y="38" width="8" height="27" rx="1" fill="url(#zbar-h-c-dark)"/>
    <rect x="22" y="28" width="8" height="37" rx="1" fill="url(#zbar-h-c-dark)"/>
    <rect x="33" y="18" width="8" height="47" rx="1" fill="url(#zbar-h-c-dark)"/>
    <rect x="44" y="30" width="8" height="35" rx="1" fill="url(#zbar-h-c-dark)"/>
    <rect x="55" y="42" width="8" height="23" rx="1" fill="url(#zbar-h-c-dark)"/>
    <rect x="66" y="35" width="8" height="30" rx="1" fill="url(#zbar-h-c-dark)"/>
    <rect x="77" y="50" width="7" height="15" rx="1" fill="url(#zbar-h-c-dark)"/>
  </g>
  <text x="115" y="70" class="logotype">Z-Data</text>
</svg>
