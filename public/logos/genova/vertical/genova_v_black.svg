<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="240" height="200">
  <defs>
    <style type="text/css">
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&amp;display=swap');
      .logotype { font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -0.025em; fill: #000000; text-anchor: middle; }
      .inc { font-weight: 500; }
    </style>
  </defs>
  <g transform="translate(70,20)">
    <rect x="14" y="40" width="10" height="20" fill="#000000"/>
    <rect x="30" y="28" width="10" height="44" fill="#000000"/>
