    <rect x="60" y="28" width="10" height="44" fill="#000000"/>
    <rect x="76" y="40" width="10" height="20" fill="#000000"/>
  </g>
  <text x="120" y="160" class="logotype">Genova<tspan class="inc"> Inc.</tspan></text>
